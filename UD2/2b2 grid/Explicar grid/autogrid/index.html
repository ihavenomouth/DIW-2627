<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="code.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Ejemplo de autogrid</h1>
  <form action="">
    <button type="button" id="btnAdd">Añadir elemento</button>
    <button type="button" id="btnRemove">Eliminar elemento</button>

      <label for="txtFiltro">Filtrado</label>
      <input type="text" name="txtFiltro" id="txtFiltro" placeholder="ideogram4.jpeg">

      <label for="txtTamaño">Tamaño mínimo (300px)</label>
      <input type="range" name="txtTamaño" id="txtTamaño" value="300" min="100" max="1000">
  </form>

  <section id="galeria" class="autogrid"></section>
</body>
</html>
