<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <article>
    <h3 class="card-title text-center">Login</h3>


    <div class="contenido">
      <form action="">
        <div class="form-group con-borde-inferior">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
          <input type="text" placeholder="User name">
        </div>
        <div class="form-group con-borde-inferior">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-key"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0" /><path d="M15 9h.01" /></svg>
          <input type="password" placeholder="Password">
        </div>

        <div class="form-group con-check-box">
          <label>
            <input type="checkbox" id="txtRememberMe">
            Remember me
          </label>
          <p><a href="">¿Forgot password?</a></p>
        </div>

        <button type="button" class="primary">Sign In</button>
      </form>

      <p class="continue text-center">Continue with</p>


      <div class="botones-redes-sociales">
        <button type="button" class="facebook"><img src="facebook.svg" alt=""><span>Facebook</span></button>
        <button type="button" class="twitter"><img src="twitter.svg" alt=""><span>Twitter</span></button>
      </div>


      <p class="text-center">Don't have an account? <a href="">Sign Up</a></p>
    </div>
  </article>
  
</body>
</html>
