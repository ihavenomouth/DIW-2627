<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @import url(https://fonts.googleapis.com/css?family=Roboto:100,100italic,300,300italic,regular,italic,500,500italic,700,700italic,900,900italic);

body{	font-family: 'Roboto', Arial, Helvetica, sans-serif;}
h1, h2{font-weight: normal;}
*,::after, ::before{	box-sizing: border-box; }

#crearProducto, #eliminarProducto{
	display:none;
	padding: 1rem;
	background-color: #ddf;
}

#crearProducto:target, #eliminarProducto:target {
	display: block;
}

a{
  display: inline-block;
  margin-top: 1rem;
  border: 1px solid #aaf;
  padding: 0.25rem 1rem;
  border-radius: 5px;;
  background-color: #679;
  color: white;
  text-decoration: none;;
}
  </style>
</head>
<body>
  <h1>Ejemplo de uso de target</h1>
  <h1>Uso del pseudoselector :target</h1>
	<p>Abrir el formulario de <a href="#crearProducto">crear producto</a></p>
	<p>Abrir el formulario de <a href="#eliminarProducto">eliminar producto</a></p>

	<div id="crearProducto">
		<h2>Crear producto</h2>
		<form>
			<label for="txtProducto">Nombre producto:</label><br>
			<input type="text" name="txtProducto" id="txtProducto"><br>
			<button>Crear producto</button>
		</form>
		<a href="#">Cerrar</a>
	</div>

	<div id="eliminarProducto">
		<h2>Eliminar producto</h2>
		<form>
			<label for="txtProducto">Nombre producto:</label><br>
			<input type="text" name="txtProductoEliminar" id="txtProductoEliminar"><br>
			<button>Eliminar producto</button>
		</form>
		<a href="#">Cerrar</a>
	</div>
  
</body>
</html>
